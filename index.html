    </div>
    <div style="margin-top:12px">
      <select class="field" style="width:100%">
        <option>1 guest</option>
        <option>2 guests</option>
        <option>3 guests</option>
        <option>4-6 guests</option>
      </select>
    </div>
    <div style="margin-top:12px">
      <textarea class="area" rows="4" style="width:100%" placeholder="Tell the host what you are hoping this retreat will hold for you..."></textarea>
    </div>
    <div class="actions" style="margin-top:14px">
      <button class="btn primary" onclick="app.book()">Send Request</button>
      <button class="btn ghost" onclick="app.closeModalDirect()">Cancel</button>
    </div>
    <div class="modal-note">Abbey-nb favors a slower, more personal booking experience rooted in reverence and trust.</div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="./app.js"></script>
</body>
</html>
